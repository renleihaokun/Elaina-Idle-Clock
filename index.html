<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#1a1024">
    <link rel="icon" href="data:,">
    <title>伊蕾娜の魔法手账</title>
    
    <!-- 外部资源（样式与脚本都不阻塞首屏：字体用 media 切换异步加载，农历库 async） -->
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet"></noscript>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.min.js" async></script>
    
    <!-- 本地样式 -->
    <link rel="stylesheet" href="style.css?v=20261108">
</head>
<body>
    <!-- 课表上传隐藏输入 -->
    <input type="file" id="ics-upload" accept=".ics" style="display: none;">

    <!-- 背景层：用 <img> 而非 CSS background，保证同一张图只解码一次 -->
    <div id="magic-flash"></div>
    <img id="bg1" class="bg-layer" alt="" aria-hidden="true" draggable="false">
    <img id="bg2" class="bg-layer" alt="" aria-hidden="true" draggable="false">
    <canvas id="fx-canvas" aria-hidden="true"></canvas>
    <div id="fx-vignette" aria-hidden="true"></div>

    <!-- 巴法云亮度遮罩层 -->
    <div id="bemfa-mask"></div>

    <!-- UI 组件 -->
    <main>
        <!-- 左上：时间与天气 -->
        <section class="widget top-left">
            <time id="time" onclick="togglePanel('settings-panel')" title="点击调整组件大小">00:00</time>
            <div class="date-info">
                <span id="date">--月--日 星期-</span>
                <span id="lunar-date">农历--</span>
                <span id="holiday-tag"></span>
            </div>
            <div class="weather-module" onclick="togglePanel('location-panel')" title="点击手动配置地区">
                <span id="weather-main">🪄 天气感知中...</span>
                <span id="weather-details"></span>
                <span id="weather-advice"></span>
            </div>
        </section>

        <!-- 右上：状态信息 -->
        <section class="widget top-right">
            <span id="battery">🔋 --%</span>
            <span id="weekend-countdown">周末计算中...</span>
        </section>

        <!-- 左下：一言 -->
        <section class="widget bottom-left" onclick="fetchWitchQuote()" title="获取魔女的洞察">
            <span id="hitokoto-text">魔女正在记录世界...</span>
            <span id="hitokoto-author"></span>
        </section>

        <!-- 右下：课表与进度（点击导入见 script.js 的事件绑定） -->
        <section class="widget bottom-right course-side-layout" title="点击导入课表(.ics)，长按进行中的课程可标记翘课">
            <!-- 左侧：纵向贯穿的标签 -->
            <span id="course-label" class="course-group-label">加载中</span>
            <!-- 中间：纵向分割线 -->
            <div class="course-main-divider"></div>
            <!-- 右侧：内容堆叠区 -->
            <div class="course-content-stack">
                <div id="course-items-container" class="course-parallel-container">
                    <span id="course-title">📅 点击导入课表(.ics)</span>
                </div>
                <hr class="divider" style="margin: 8px 0;">
                <div class="progress-label">
                    <span>今日进度</span><span id="progress-text">0%</span>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- 弹出面板 -->
    <aside>
        <!-- 缩放控制面板 -->
        <div id="settings-panel" class="modal-panel">
            <h3 style="color: #ffeb3b;">⚙️ 魔法手账设置</h3>
            <p>组件缩放比例: <span id="scale-value">100%</span></p>
            <input type="range" id="scale-slider" min="0.5" max="1.5" step="0.05" value="1">
            <p>环境特效强度: <span id="fx-level-value">标准</span></p>
            <input type="range" id="fx-level-slider" min="0" max="3" step="1" value="2" title="老手机若发热或掉帧，可调低档位">
            <p>毛玻璃模式: <span id="glass-mode-value">自动</span></p>
            <select id="glass-mode-select" title="低端机选静态更稳：用预模糊壁纸，不再每帧实时模糊">
                <option value="auto">自动（按设备判断）</option>
                <option value="live">动态（实时模糊）</option>
                <option value="static">静态（预模糊壁纸）</option>
            </select>
            <label class="setting-check" title="每天 04:00 短暂重新加载页面，清理浏览器级残留；会释放 Wake Lock，建议按需开启"><input type="checkbox" id="auto-reload-toggle"> 每日 04:00 自愈刷新（会短暂重载）</label>
            <button class="close-btn" style="width:100%; margin-bottom: 10px; background: rgba(129, 236, 236, 0.2); border-color: rgba(129, 236, 236, 0.4);" onclick="toggleFullScreen()">🖥️ 切换全屏模式</button>
            <hr class="divider">
            <h3>💡 巴法云远程亮度</h3>
            <input type="text" id="bemfa-uid" placeholder="UID（巴法云个人中心-秘钥）">
            <input type="text" id="bemfa-topic" placeholder="主题名（如 clocklight002）">
            <span id="bemfa-status" style="display:block; margin:8px 0; font-size:0.8rem; color:#ff9a9e;">未连接</span>
            <button class="close-btn" id="bemfa-action-btn" onclick="try{Bemfa.isConnected() ? Bemfa.disconnect() : Bemfa.save()}catch(e){}" style="width:100%; margin:5px 0; background:rgba(129,236,236,0.2); border-color:rgba(129,236,236,0.4);">🔌 连接</button>
            <button class="close-btn" onclick="try{Bemfa.clear()}catch(e){}" style="width:100%; margin:5px 0 10px 0;">🚫 断开并清除配置</button>
            <hr class="divider">
            <button class="close-btn" id="diag-toggle" style="width:100%; margin-bottom:10px;" aria-pressed="false">🩺 诊断信息</button>
            <button class="close-btn" id="diag-export" style="width:100%; margin-bottom:10px;">📋 导出诊断</button>
            <textarea id="diag-dump" readonly placeholder="点「导出诊断」后显示，可长按复制" style="display:none; width:100%; height:120px; box-sizing:border-box; margin-bottom:10px; border-radius:8px; border:1px solid rgba(255,255,255,.25); background:rgba(0,0,0,.35); color:#b8ffd9; font:11px/1.4 monospace; padding:8px;"></textarea>
            <button class="close-btn" onclick="togglePanel('settings-panel')">完成</button>
        </div>

        <!-- 气象定位面板 -->
        <div id="location-panel" class="modal-panel">
            <h3>📍 气象定位仪</h3>
            <div class="loc-input-group">
                <input type="text" id="loc-input" placeholder="输入城市或区县 (如:海淀区)">
                <button id="loc-search-btn" onclick="searchLocation()">搜索</button>
            </div>
            <button class="close-btn" style="width:100%; margin: 0 0 15px 0; background: rgba(161, 196, 253, 0.7); color: #000; font-weight: bold;" onclick="autoLocate()">🎯 自动获取当前精准坐标</button>
            <div id="loc-results"></div>
            <button class="close-btn" onclick="togglePanel('location-panel')">关闭</button>
        </div>
    </aside>

    <!-- 诊断 / 轻提示层 -->
    <div id="diag-overlay" aria-hidden="true"></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <!-- 诊断先加载：尽早挂错误钩子 -->
    <script src="diag.js?v=20261108" defer></script>
    <!-- 巴法云亮度控制（mqtt 库由 bemfa.js 按需异步加载，避免 CDN 阻塞首屏） -->
    <script src="bemfa.js?v=20261108" defer></script>

    <!-- 核心逻辑 -->
    <script src="effects.js?v=20261108" defer></script>
    <script src="script.js?v=20261108" defer></script>
</body>
</html>
